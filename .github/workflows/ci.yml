name: ci

on:
  push:
    branches:
      - main
      - feat/bluetooth-controller-mvp
  pull_request:

jobs:
  cargo-check:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --all-targets
