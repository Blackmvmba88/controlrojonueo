name: ci

on:
  push:
    branches:
      - main
      - feat/xbox-desktop-control
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --all-targets

      - name: Unit tests
        run: cargo test --all-targets
